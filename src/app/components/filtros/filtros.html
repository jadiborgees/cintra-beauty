<aside class="filtros">

  <div class="filtros__titulo">
    <i class="bi bi-sliders"></i>
    <span>Filtros</span>
  </div>

  <!-- BUSCA -->
  <div class="filtros__grupo">
    <label for="busca">
      Buscar perfume
    </label>

    <div class="filtros__busca">
      <input
        id="busca"
        type="text"
        placeholder="Buscar perfume..."
        [ngModel]="busca()"
        (ngModelChange)="busca.set($event); atualizarFiltros()"
      >

      <i class="bi bi-search"></i>
    </div>
  </div>

  <!-- GÊNERO -->
  <div class="filtros__grupo">
    <h3>Gênero</h3>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="genero"
        value=""
        [ngModel]="genero()"
        (ngModelChange)="genero.set($event); atualizarFiltros()"
      >
      Todos
    </label>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="genero"
        value="Masculino"
        [ngModel]="genero()"
        (ngModelChange)="genero.set($event); atualizarFiltros()"
      >
      Masculino
    </label>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="genero"
        value="Feminino"
        [ngModel]="genero()"
        (ngModelChange)="genero.set($event); atualizarFiltros()"
      >
      Feminino
    </label>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="genero"
        value="Unissex"
        [ngModel]="genero()"
        (ngModelChange)="genero.set($event); atualizarFiltros()"
      >
      Unissex
    </label>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="genero"
        value="Infantil"
        [ngModel]="genero()"
        (ngModelChange)="genero.set($event); atualizarFiltros()"
      >
      Infantil
    </label>
  </div>

  <!-- DESTAQUES -->
  <div class="filtros__grupo">
    <h3>Destaques</h3>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="destaque"
        value=""
        [ngModel]="destaque()"
        (ngModelChange)="destaque.set($event); atualizarFiltros()"
      >
      Todos
    </label>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="destaque"
        value="mais-vendidos"
        [ngModel]="destaque()"
        (ngModelChange)="destaque.set($event); atualizarFiltros()"
      >
      Mais vendidos
    </label>

    <label class="filtros__opcao">
      <input
        type="radio"
        name="destaque"
        value="novidades"
        [ngModel]="destaque()"
        (ngModelChange)="destaque.set($event); atualizarFiltros()"
      >
      Novidades
    </label>
  </div>

  <!-- MARCA -->
  <div class="filtros__grupo">
    <h3>Marca</h3>

    <select
      [ngModel]="marca()"
      (ngModelChange)="marca.set($event); atualizarFiltros()"
    >
      <option value="">
        Todas as marcas
      </option>

      @for (item of marcas; track item) {
        <option [value]="item">
          {{ item }}
        </option>
      }
    </select>
  </div>

  <!-- FAIXA DE PREÇO -->
  <div class="filtros__grupo">

    <h3>
      Faixa de preço
    </h3>

    <div class="filtros__precos">

      <!-- MÍNIMO -->
      <div class="filtros__campo-preco">

        <label for="preco-minimo">
          Mínimo
        </label>

        <div class="filtros__input-preco">

          <span>
            R$
          </span>

          <input
            id="preco-minimo"
            type="number"
            min="0"
            step="10"
            placeholder="0"

            [ngModel]="precoMinimo()"

            (ngModelChange)="
              atualizarPrecoMinimo($event)
            "
          >

        </div>

      </div>

      <!-- MÁXIMO -->
      <div class="filtros__campo-preco">

        <label for="preco-maximo">
          Máximo
        </label>

        <div class="filtros__input-preco">

          <span>
            R$
          </span>

          <input
            id="preco-maximo"
            type="number"
            min="0"
            step="10"
            placeholder="2500"

            [ngModel]="precoMaximo()"

            (ngModelChange)="
              atualizarPrecoMaximo($event)
            "
          >

        </div>

      </div>

    </div>

  </div>

  <!-- LIMPAR FILTROS -->
  <button
    type="button"
    class="filtros__limpar"
    (click)="limparFiltros()"
  >
    Limpar filtros
  </button>

</aside>
